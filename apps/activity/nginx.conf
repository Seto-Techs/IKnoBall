# Discord's proxy reaches this server through the portal's `/` URL mapping, so
# the app is always served from the root of its own origin. Assets are hashed by
# Vite and cached hard; index.html is not, so a new deploy is picked up.
server {
  listen 3000;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  location /assets/ {
    expires 1y;
    add_header Cache-Control 'public, immutable';
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
