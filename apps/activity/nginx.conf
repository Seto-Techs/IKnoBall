# Discord's proxy reaches this server through the portal's `/` URL mapping, so
# the app is always served from the root of its own origin. Assets are hashed by
# Vite and cached hard; index.html is not, so a new deploy is picked up.
server {
  listen 3000;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  location /assets/ {
    expires 1y;
    add_header Cache-Control 'public, immutable';
    try_files $uri =404;
  }

  # `no-cache` still allows a conditional request, so an unchanged index.html
  # costs a 304 rather than a re-download. Without a Cache-Control at all nginx
  # sends only Last-Modified/ETag, and a browser may heuristically cache the
  # document for a slice of its age — inside Discord that means a stale index
  # pointing at asset hashes the new image no longer has, i.e. a white screen.
  location / {
    add_header Cache-Control 'no-cache';
    try_files $uri $uri/ /index.html;
  }
}
