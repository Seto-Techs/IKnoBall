name: CD

on:
  pull_request:
    branches: [dev, main]
    types: [closed]

env:
  REGISTRY: ghcr.io
  BE_IMAGE: seto-techs/iknoball-be
  FE_IMAGE: seto-techs/iknoball-fe
  WORKER_IMAGE: seto-techs/iknoball-worker

jobs:
  # ── BUILD: BACKEND ──────────────────────────────────────────
  build-be:
    if: |
      github.event.pull_request.merged == true &&
      (github.event.pull_request.base.ref == 'dev' ||
       (github.event.pull_request.base.ref == 'main' && github.event.pull_request.head.ref == 'be'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tag
        id: tag
        run: |
          if [ "${{ github.event.pull_request.base.ref }}" = "main" ]; then
            echo "tag=prod" >> $GITHUB_OUTPUT
          else
            echo "tag=staging" >> $GITHUB_OUTPUT
          fi

      - name: Build & push BE
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./apps/backend/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.BE_IMAGE }}:${{ steps.tag.outputs.tag }}

  # ── BUILD: FRONTEND ─────────────────────────────────────────
  build-fe:
    if: |
      github.event.pull_request.merged == true &&
      (github.event.pull_request.base.ref == 'dev' ||
       (github.event.pull_request.base.ref == 'main' && github.event.pull_request.head.ref == 'fe'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tag
        id: tag
        run: |
          if [ "${{ github.event.pull_request.base.ref }}" = "main" ]; then
            echo "tag=prod" >> $GITHUB_OUTPUT
            echo "api_url=https://api-iknoball.setotechs.com" >> $GITHUB_OUTPUT
          else
            echo "tag=staging" >> $GITHUB_OUTPUT
            echo "api_url=https://api-iknoball-staging.setotechs.com" >> $GITHUB_OUTPUT
          fi

      - name: Build & push FE
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./apps/frontend/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.FE_IMAGE }}:${{ steps.tag.outputs.tag }}
          build-args: |
            VITE_API_URL=${{ steps.tag.outputs.api_url }}

  # ── BUILD: WORKER ───────────────────────────────────────────
  build-worker:
    if: |
      github.event.pull_request.merged == true &&
      (github.event.pull_request.base.ref == 'dev' ||
       (github.event.pull_request.base.ref == 'main' && github.event.pull_request.head.ref == 'worker'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tag
        id: tag
        run: |
          if [ "${{ github.event.pull_request.base.ref }}" = "main" ]; then
            echo "tag=prod" >> $GITHUB_OUTPUT
          else
            echo "tag=staging" >> $GITHUB_OUTPUT
          fi

      - name: Build & push Worker
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./apps/worker/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.WORKER_IMAGE }}:${{ steps.tag.outputs.tag }}

  # ── DEPLOY ──────────────────────────────────────────────────
  deploy:
    needs: [build-be, build-fe, build-worker]
    if: |
      always() &&
      github.event.pull_request.merged == true &&
      needs.build-be.result != 'failure' &&
      needs.build-be.result != 'cancelled' &&
      needs.build-fe.result != 'failure' &&
      needs.build-fe.result != 'cancelled' &&
      needs.build-worker.result != 'failure' &&
      needs.build-worker.result != 'cancelled' &&
      (needs.build-be.result == 'success' ||
       needs.build-fe.result == 'success' ||
       needs.build-worker.result == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      pull-requests: read

    env:
      SOURCE_BRANCH: ${{ github.event.pull_request.head.ref }}
      TARGET_BRANCH: ${{ github.event.pull_request.base.ref }}
      ENV: ${{ github.event.pull_request.base.ref == 'main' && 'prod' || 'staging' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # ── COLLECT COMMITS ────────────────────────────────────
      - name: Collect commits
        id: collect
        run: |
          git fetch --prune --unshallow || true

          BASE_BRANCH="${{ github.event.pull_request.base.ref }}"
          HEAD_BRANCH="${{ github.event.pull_request.head.ref }}"

          COMMITS_JSON=$(git log "origin/$BASE_BRANCH..origin/$HEAD_BRANCH" \
            --pretty=format:'{"sha":"%h","author":"%an","date":"%ad","message":"%s","branch":"'$HEAD_BRANCH'"}' \
            --date=iso | jq -s .)

          SHA="${{ github.event.pull_request.head.sha }}"
          MESSAGE="${{ github.event.pull_request.title }}"
          AUTHOR="${{ github.event.pull_request.user.login }}"

          COMMITS_BASE64=$(echo "$COMMITS_JSON" | base64 | tr -d '\n')

          echo "SHA=$SHA" >> $GITHUB_ENV
          echo "MESSAGE=$MESSAGE" >> $GITHUB_ENV
          echo "AUTHOR=$AUTHOR" >> $GITHUB_ENV
          echo "COMMITS_JSON_BASE64=$COMMITS_BASE64" >> $GITHUB_ENV
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ── WORKFLOW META ─────────────────────────────────────
      - name: Set metadata
        run: |
          echo "WORKFLOW=CD – DuitRapi" >> $GITHUB_ENV
          echo "STATUS=RUNNING" >> $GITHUB_ENV
          echo "STAGE=deploy" >> $GITHUB_ENV
          echo "START=$(date -u +"%Y-%m-%dT%H:%M:%SZ")" >> $GITHUB_ENV
          echo "LOGS_URL=https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" >> $GITHUB_ENV

      # ── CREATE NOTION RUN ─────────────────────────────────
      - name: Create Notion Run
        id: notion
        run: |
          export COMMITS_JSON=$(echo "$COMMITS_JSON_BASE64" | base64 --decode)

          PAGE_ID=$(node --input-type=module -e "
            import { createRunWithCommits } from './apps/backend/notion-log.mjs';

            const pageId = await createRunWithCommits({
              workflow: process.env.WORKFLOW,
              branch: process.env.BRANCH,
              env: process.env.ENV,
              status: 'BUILDING',
              stage: 'build',
              start: process.env.START,
              logsUrl: process.env.LOGS_URL,
              author: process.env.AUTHOR,
              message: process.env.MESSAGE,
              commitsJson: process.env.COMMITS_JSON
            });

            process.stdout.write(pageId);
          ")
          echo "page_id=$PAGE_ID" >> $GITHUB_OUTPUT
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          WORKFLOW: ${{ env.WORKFLOW }}
          ENV: ${{ env.ENV }}
          BRANCH: ${{ env.SOURCE_BRANCH }}
          AUTHOR: ${{ env.AUTHOR }}
          MESSAGE: ${{ env.MESSAGE }}
          COMMITS_JSON_BASE64: ${{ env.COMMITS_JSON_BASE64 }}
          START: ${{ env.START }}
          LOGS_URL: ${{ env.LOGS_URL }}

      # ── MARK DEPLOYING ────────────────────────────────────
      - name: Mark DEPLOYING
        run: |
          node --input-type=module -e "
            import { updateRun } from './apps/backend/notion-log.mjs';

            await updateRun('${{ steps.notion.outputs.page_id }}', {
              status: 'DEPLOYING',
              stage: 'deploy'
            });
          "
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}

      # ── DEPLOY VIA DOKPLOY ────────────────────────────────
      - name: Deploy via Dokploy
        run: |
          PROJECT_NAME="iknoball"
          COMPOSE_NAME="staging"

          PROJECTS=$(curl -s -X GET \
            "${{ secrets.DOKPLOY_HOST }}/api/project.all" \
            -H "accept: application/json" \
            -H "x-api-key: ${{ secrets.DOKPLOY_API_KEY }}")

          COMPOSE_ID=$(echo "$PROJECTS" | jq -r "
            .[] | select(.name == \"$PROJECT_NAME\") |
            .environments[].compose[] |
            select(.name == \"$COMPOSE_NAME\") |
            .composeId
          ")

          if [ -z "$COMPOSE_ID" ]; then
            echo "ERROR: compose $COMPOSE_NAME not found in project $PROJECT_NAME"
            exit 1
          fi

          echo "Deploying composeId: $COMPOSE_ID"

          curl -s -X POST \
            "${{ secrets.DOKPLOY_HOST }}/api/compose.deploy" \
            -H "accept: application/json" \
            -H "x-api-key: ${{ secrets.DOKPLOY_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d "{\"composeId\": \"$COMPOSE_ID\"}"

      # ── MARK FINAL STATUS ─────────────────────────────────
      - name: Mark FINAL STATUS
        if: always()
        run: |
          node --input-type=module -e "
            import { updateRun } from './apps/backend/notion-log.mjs';

            const status = '${{ job.status }}' === 'success' ? 'SUCCESS' : 'FAILED';

            await updateRun('${{ steps.notion.outputs.page_id }}', {
              status,
              stage: status === 'SUCCESS' ? 'done' : 'failed',
              end: new Date().toISOString()
            });
          "
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
